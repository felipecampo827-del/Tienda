<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Faiber Store - USA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black; /* Fondo negro en toda la pantalla */
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        h1 { color: gold; padding: 20px; }
        .seccion {
            margin: 40px auto;
            padding: 20px;
            width: 90%;
        }
        .producto {
            border: 2px solid gold;
            padding: 20px;
            margin: 20px;
            display: inline-block;
            width: 250px;
            background: rgba(0,0,0,0.9); /* Negro con leve transparencia */
        }
        .producto h2 { color: #00ffcc; }
        .btn {
            background-color: gold;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>💵 Faiber Store USA 💵</h1>

    <!-- Sección Ropa -->
    <div class="seccion">
        <h2>👕 Sección Ropa</h2>
        <div class="producto">

            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                <input type="hidden" name="cmd" value="_xclick">
                <input type="hidden" name="business" value="TU_CORREO_PAYPAL@ejemplo.com">
                <input type="hidden" name="item_name" value="Camisa elegante">
                <input type="hidden" name="amount" value="40.00">
                <input type="hidden" name="currency_code" value="USD">
                <input type="submit" value="Comprar con PayPal" class="btn">
            </form>
        </div>
    </div>
