<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Faiber Store - USA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: black url('https://img.freepik.com/free-vector/money-background-dollar-bills_1017-30365.jpg') repeat;
            color: white;
            text-align: center;
        }
        h1 { color: gold; }
        .seccion {
            margin: 40px auto;
            padding: 20px;
            border: 2px solid gold;
            width: 80%;
            background: rgba(0,0,0,0.7);
        }
        .producto {
            border: 1px solid #444;
            padding: 20px;
            margin: 20px;
            display: inline-block;
            width: 250px;
            background: #111;
        }
        .producto h2 { color: #00ffcc; }
        .btn {
            background-color: gold;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>💵 Faiber Store USA 💵</h1>

    <!-- Sección Ropa -->
    <div class="seccion">

        <div class="producto">
            <h2>Camisa elegante</h2>

            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                <input type="hidden" name="cmd" value="_xclick">
                <input type="hidden" name="business" value="TU_CORREO_PAYPAL@ejemplo.com">
                <input type="hidden" name="item_name" value="Camisa elegante">
                <input type="hidden" name="amount" value="40.00">
                <input type="hidden" name="currency_code" value="USD">
                <input type="submit" value="Comprar con PayPal" class="btn">
            </form>
        </div>
    </div>
