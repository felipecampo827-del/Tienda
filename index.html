<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Faiber Store</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      color: gold;
      padding: 20px;
    }
    .producto {
      margin: 40px auto;
      width: 400px;
    }
    .producto img {
      width: 100%;
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }
    /* Visor ampliado */
    #visor {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #visor img {
      max-width: 80%;
      max-height: 80%;
      cursor: zoom-out;
      transition: transform 0.3s ease;
    }
    #cerrar {
      margin-top: 20px;
      background: gold;
      color: black;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <h1>💵 Faiber Store 💵</h1>

  <!-- Camisa -->
  <div class="producto">
    <h2>Camisa Oversize</h2>
    <img id="camisa" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNB1dcj-z7LLVJAuziUdTdeCggcp7_he3tpg&s" alt="Camisa Oversize">
    <p>Precio: 40 USD</p>
  </div>

  <!-- Crema CeraVe -->
  <div class="producto">
    <h2>Crema CeraVe</h2>
    <img id="crema" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKKZWA8HSvM-jBizHsnBorgJfv8WyxZTXRcA&s" alt="Crema CeraVe">
    <p>Precio: 50 USD</p>
  </div>

  <!-- Vela -->
  <div class="producto">
    <h2>Vela aromática</h2>
    <img id="vela" src="https://casatriada.com/cdn/shop/files/CASA-TRIADA-CASA-TRIADA-VELA-HOME-PORTADA.jpg?v=1771885383&width=1445" alt="Vela aromática">
    <p>Precio: 25 USD</p>
  </div>

  <!-- Correa de perro -->
  <div class="producto">
    <h2>Correa para perro</h2>
    <img id="correa" src="https://http2.mlstatic.com/D_NQ_NP_723579-CBT92844614275_092025-O.webp" alt="Correa para perro">
    <p>Precio: 30 USD</p>
  </div>

  <!-- Visor ampliado -->
  <div id="visor">
    <img id="imagenGrande" src="" alt="Producto grande">
    <button id="cerrar">❌ Cerrar</button>
  </div>

  <script>
    const visor = document.getElementById("visor");
    const imagenGrande = document.getElementById("imagenGrande");
    const cerrar = document.getElementById("cerrar");

    // Función para abrir visor con zoom
    function abrirVisor(src) {
      imagenGrande.src = src;
      visor.style.display = "flex";
      imagenGrande.style.transform = "scale(1.2)";
    }

    // Asignar eventos a cada producto
    document.getElementById("camisa").addEventListener("click", () => abrirVisor("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNB1dcj-z7LLVJAuziUdTdeCggcp7_he3tpg&s"));
    document.getElementById("crema").addEventListener("click", () => abrirVisor("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKKZWA8HSvM-jBizHsnBorgJfv8WyxZTXRcA&s"));
    document.getElementById("vela").addEventListener("click", () => abrirVisor("https://casatriada.com/cdn/shop/files/CASA-TRIADA-CASA-TRIADA-VELA-HOME-PORTADA.jpg?v=1771885383&width=1445"));
    document.getElementById("correa").addEventListener("click", () => abrirVisor("https://http2.mlstatic.com/D_NQ_NP_723579-CBT92844614275_092025-O.webp"));

    // Cerrar visor
    cerrar.addEventListener("click", () => {
      visor.style.display = "none";
      imagenGrande.style.transform = "scale(1)";
    });

    // También cerrar al hacer clic en la imagen ampliada
    imagenGrande.addEventListener("click", () => {
      visor.style.display = "none";
      imagenGrande.style.transform = "scale(1)";
    });
  </script>
</body>
</html>
