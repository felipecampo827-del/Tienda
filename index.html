<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Faiber Store - USA</title>
    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .producto img {
            max-width: 200px;
            cursor: pointer;
            transition: transform 0.5s ease;
        }
        /* Imagen ampliada */
        #visor {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #visor img {
            max-width: 400px;
            transition: transform 0.5s ease;
        }
        #cerrar {
            margin-top: 20px;
            background: gold;
            color: black;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
        }
        #rotar {
            margin-top: 10px;
            background: #00ffcc;
            color: black;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Faiber Store USA</h1>

    <!-- Producto: Camisa -->
    <div class="producto">
        <h2>Camisa elegante</h2>
        <img id="camisa" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNB1dcj-z7LLVJAuziUdTdeCggcp7_he3tpg&s" alt="Camisa elegante">
    </div>

    <!-- Visor -->
    <div id="visor">
        <img id="camisaGrande" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNB1dcj-z7LLVJAuziUdTdeCggcp7_he3tpg&s" alt="Camisa grande">
        <button id="rotar">🔄 Girar</button>
        <button id="cerrar">❌ Cerrar</button>
    </div>

    <script>
        const camisa = document.getElementById("camisa");
        const visor = document.getElementById("visor");
        const camisaGrande = document.getElementById("camisaGrande");
        const cerrar = document.getElementById("cerrar");
        const rotar = document.getElementById("rotar");

        let angulo = 0;

        // Abrir visor al hacer clic en la camisa
        camisa.addEventListener("click", () => {
            visor.style.display = "flex";
        });

        // Cerrar visor
        cerrar.addEventListener("click", () => {
            visor.style.display = "none";
        });

        // Rotar imagen
        rotar.addEventListener("click", () => {
            angulo += 90;
            camisaGrande.style.transform = `rotate(${angulo}deg)`;
        });
    </script>
</body>
</html>
